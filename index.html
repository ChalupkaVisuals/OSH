<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSH · Osu Skin Homie</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // set the saved theme before first paint
    try { document.documentElement.dataset.theme = localStorage.getItem('osh-theme') || 'light'; } catch {}
  </script>
</head>
<body>
  <header id="top" class="card">
    <div class="brand">
      <img class="mascot" src="img/mascot.png" alt="">
      <div><b>OSH</b><span>Osu Skin Homie</span></div>
    </div>

    <label class="field name"><span>Skin name</span><input id="skinName" disabled></label>
    <label class="field"><span>Author</span><input id="skinAuthor" disabled></label>

    <div id="progress" class="progress" hidden><div class="bar"></div><span></span></div>

    <nav id="tabs" class="seg" hidden>
      <button data-tab="elements" class="on">Elements</button>
      <button data-tab="ini">skin.ini</button>
      <button data-tab="files">All files</button>
    </nav>

    <span class="grow"></span>

    <div class="menuwrap">
      <button id="btnOpen" class="round" data-icon="folder" title="Open or create a skin"></button>
      <div id="openMenu" class="menu card" hidden>
        <button id="btnImport">Import .osk / .zip</button>
        <button id="btnFolder">Import folder</button>
        <button id="btnNew">New blank skin</button>
      </div>
    </div>
    <button id="btnUndo" class="round" data-icon="undo" title="Undo (Ctrl+Z)" disabled></button>
    <button id="btnRedo" class="round" data-icon="redo" title="Redo (Ctrl+Y)" disabled></button>
    <div id="theme" class="seg theme">
      <button data-theme="light" data-icon="sun" title="Light theme"></button>
      <button data-theme="dark" data-icon="moon" title="Dark theme"></button>
    </div>
    <button id="btnExport" class="primary big" disabled>Save as .osk</button>
  </header>

  <div id="welcome">
    <div class="drop card">
      <img class="mascot big" src="img/mascot.png" alt="">
      <h1>Drop an osu! skin here</h1>
      <p>.osk file, .zip, or a skin folder. Everything stays on this computer.</p>
      <div class="row">
        <button class="primary big" id="wImport">Choose .osk / .zip</button>
        <button class="big" id="wFolder">Choose folder</button>
        <button class="big" id="wNew">Start from scratch</button>
      </div>
    </div>
  </div>

  <div id="work" hidden>
    <div id="chipsRow">
      <button class="arrow" id="chipL" data-icon="chevL" title="Scroll left"></button>
      <div id="chips"></div>
      <button class="arrow" id="chipR" data-icon="chevR" title="Scroll right"></button>
    </div>

    <div id="cols">
      <section id="left" class="card">
        <div id="view-elements" class="view">
          <div class="toolbar">
            <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search elements..."></label>
            <span class="grow"></span>
            <label class="switchrow">Missing only <input type="checkbox" class="switch" id="missingOnly"></label>
          </div>
          <div id="grid"></div>
        </div>
        <div id="view-ini" class="view" hidden></div>
        <div id="view-files" class="view" hidden></div>
      </section>

      <aside id="right">
        <div class="card pvcard">
          <h2>Live preview</h2>
          <div class="pvbox">
            <canvas id="pv"></canvas>
            <div class="pvbtns">
              <button id="pvSpeed" class="pvspeed" title="Playback speed">1.0x</button>
              <button id="pvPlay" class="pvplay" data-icon="pause" title="Pause or play"></button>
            </div>
          </div>
          <div class="pvctl">
            <label>Circle size <input type="range" id="pvCs" min="2" max="7" step="0.5" value="4"></label>
            <label>Background <input type="color" id="pvBg" value="#191530"></label>
          </div>
        </div>
        <div class="card" id="insp"></div>
      </aside>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
